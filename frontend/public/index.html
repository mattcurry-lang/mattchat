<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="google-site-verification" content="siefAvgcECHrZdmv8SknkvI25iHPk70qROwPwnVCwjg" />
  <!-- Primary SEO -->
  <title>Mattchat | The Intelligent Communication Platform</title>
  <meta
    name="description"
    content="Mattchat is the intelligent communication platform that unifies conversations, email, meetings, AI assistance, and productivity into one seamless experience."
  />
  <meta
    name="keywords"
    content="Mattchat, intelligent communication platform, AI assistant, Curry AI, productivity, collaboration, messaging, email messaging, meetings, scheduling"
  />
  <meta name="author" content="Mathew Mutai" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#6C63FF" />
  <!-- Canonical URL -->
  <link rel="canonical" href="https://mattchat-nine.vercel.app/" />
  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Mattchat | The Intelligent Communication Platform" />
  <meta
    property="og:description"
    content="Mattchat brings together conversations, email, meetings, AI assistance, and productivity into one seamless experience."
  />
  <meta property="og:url" content="https://mattchat-nine.vercel.app/" />
  <meta property="og:site_name" content="Mattchat" />
  <meta
    property="og:image"
    content="https://mattchat-nine.vercel.app/preview.png"
  />
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Mattchat | The Intelligent Communication Platform" />
  <meta
    name="twitter:description"
    content="Mattchat brings together conversations, email, meetings, AI assistance, and productivity into one seamless experience."
  />
  <meta
    name="twitter:image"
    content="https://mattchat-nine.vercel.app/preview.png"
  />
  <!-- Icons -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <!-- Boot splash: shown instantly (no JS needed) until React mounts and replaces #root -->
  <style>
    html, body {
      margin: 0;
      background: #14121f;
    }

    /* SEO content stays in the DOM for crawlers/indexing, but is visually hidden */
    #seo-content {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* Visible splash — mirrors the in-app loading screen so there's no flash/mismatch */
    #boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #14121f;
    }

    #boot-splash img {
      width: 110px;
      height: 110px;
    }

    #boot-splash span {
      margin-top: 18px;
      font-family: 'Inter', sans-serif;
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #0ea5ff, #9333ea);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
  </style>
  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"SoftwareApplication",
    "name":"Mattchat",
    "applicationCategory":"CommunicationApplication",
    "operatingSystem":"Web",
    "url":"https://mattchat-nine.vercel.app/",
    "description":"Mattchat is the intelligent communication platform that unifies conversations, email, meetings, AI assistance, and productivity into one seamless experience.",
    "creator":{
      "@type":"Person",
      "name":"Mathew Mutai"
    }
  }
  </script>
</head>
<body>
  <!-- Required for Meta/Facebook JS SDK -->
  <div id="fb-root"></div>

  <!-- React mounts here. Everything below is replaced automatically the instant it does -->
  <div id="root">
    <!-- Hidden SEO content: keeps crawlers happy, invisible to users -->
    <div id="seo-content">
      <header>
        <h1>Mattchat | The Intelligent Communication Platform</h1>
      </header>
      <main>
        <section>
          <p>
            Mattchat is the intelligent communication platform that unifies conversations, email,
            meetings, AI assistance featuring Curry AI, and productivity into one seamless experience.
          </p>
        </section>
        <footer>
          <nav>
            <a href="/privacy">Privacy Policy</a> |
            <a href="/terms">Terms of Service</a>
          </nav>
        </footer>
      </main>
    </div>

    <!-- Visible boot splash: matches the in-app loader exactly -->
    <div id="boot-splash">
      <img src="/logo.png" alt="Mattchat" />
      <span>Mattchat</span>
    </div>
  </div>
</body>
</html>
