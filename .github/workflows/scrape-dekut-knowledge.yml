name: Scrape DeKUT Knowledge

on:
  workflow_dispatch: # adds a manual "Run workflow" button in the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ADMIN_EMAIL: ${{ secrets.DEKUT_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.DEKUT_ADMIN_PASSWORD }}
        run: node scripts/scrape-dekut-knowledge.mjs
